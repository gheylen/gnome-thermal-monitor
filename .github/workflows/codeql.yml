name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "27 3 * * 1"  # weekly, Monday 03:27 UTC

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (JavaScript)
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Initialize CodeQL
        uses: github/codeql-action/init@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4.37.7
        with:
          # `javascript` still resolves, but the analysis covers both languages
          # and this is the name CodeQL uses for it.
          languages: javascript-typescript
          # The default suite is tuned to keep false positives near zero on
          # large codebases. This one is a few thousand lines with no network,
          # no subprocesses and no eval, so the extra queries cost little and the
          # alerts stay private to the repository's Security tab. Drop this line
          # to go back to the default suite.
          queries: security-extended
      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4.37.7
