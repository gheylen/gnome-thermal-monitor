name: Bug report
description: Report something that isn't working correctly
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file a report. The diagnostic commands
        below are the single biggest help in resolving issues quickly.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you expect, and what happened instead?
    validations:
      required: true

  - type: input
    id: shell-version
    attributes:
      label: GNOME Shell version
      description: "Output of: gnome-shell --version"
      placeholder: "GNOME Shell 50.2"
    validations:
      required: true

  - type: input
    id: cpu-model
    attributes:
      label: CPU model
      description: 'Output of: grep "model name" /proc/cpuinfo | head -1'
      placeholder: "Intel(R) Core(TM) i7-1360P"
    validations:
      required: true

  - type: input
    id: extension-version
    attributes:
      label: Extension version
      description: >
        The 'version' field in metadata.json, or the version shown on
        extensions.gnome.org. A single integer.
      placeholder: "e.g. 1"
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Startup log
      description: "Output of: journalctl -b /usr/bin/gnome-shell | grep ThermalThrottleMonitor"
      render: shell
    validations:
      required: false

  - type: textarea
    id: popup
    attributes:
      label: Popup detail
      description: >
        If a component is reporting the wrong thing, the two lines from its
        popup section — and, if you can, the contents of the sysfs file it
        reads — are what let us turn this into a failing test.
      render: shell
    validations:
      required: false

  - type: textarea
    id: smoke
    attributes:
      label: What this extension makes of your machine
      description: >
        The single most useful thing you can paste. It needs `gjs` and a clone
        of this repository, and nothing else — no install, no GNOME session:


        `git clone https://github.com/gheylen/gnome-thermal-monitor && cd
        gnome-thermal-monitor && gjs -m test/gjs/smoke.gjs.js`


        That runs the real hardware registry against your actual /sys and
        prints the verdicts the panel would show, including which categories
        found nothing and why. Every rule here has been checked against kernel
        source and against described machines; this is the only thing that
        reports what real silicon does.
      render: shell
    validations:
      required: false

  - type: textarea
    id: session
    attributes:
      label: Session type
      description: "X11 or Wayland? Output of: echo $XDG_SESSION_TYPE"
      placeholder: "wayland"
    validations:
      required: false
